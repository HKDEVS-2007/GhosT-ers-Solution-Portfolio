<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Signal Lost | GhosT'ers Solution</title>
  <link rel="icon" type="image/svg+xml" href="./assets/icons/favicon.svg" />
  <style>
    :root {
      --bg: #05070B;
      --cyan: #00D9FF;
      --blue: #287BFF;
      --text: #F4F7FC;
      --muted: #8B9AAD;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: radial-gradient(circle at 50% 35%, rgba(0, 217, 255, 0.12), var(--bg) 62%);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
    }
    .card {
      max-width: 520px;
      padding: 2.5rem;
      border-radius: 20px;
      background: rgba(10, 16, 25, 0.78);
      border: 1px solid rgba(0, 217, 255, 0.25);
      backdrop-filter: blur(16px);
    }
    .code {
      font-family: ui-monospace, monospace;
      font-size: 0.8rem;
      letter-spacing: 0.24em;
      color: var(--cyan);
      margin-bottom: 0.75rem;
    }
    h1 { font-size: clamp(2.5rem, 8vw, 4rem); margin-bottom: 0.75rem; }
    p { color: var(--muted); line-height: 1.7; margin-bottom: 1.75rem; }
    a {
      display: inline-block;
      padding: 0.85rem 1.6rem;
      border-radius: 999px;
      background: linear-gradient(110deg, var(--cyan), var(--blue));
      color: #05070B;
      font-weight: 700;
      text-decoration: none;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.84rem;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="code">GHOS T'ERS SOLUTION // ERROR 404</div>
    <h1>404</h1>
    <p>The coordinate you requested does not exist in this digital architecture.</p>
    <a href="./index.html">Return to Base</a>
  </main>
</body>
</html>
